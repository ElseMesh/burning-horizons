name: Refresh Loz source branches

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loz-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Burning Horizons content repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Loz source remote
        run: git remote add loz https://github.com/lozknowles/ElseMesh.git

      - name: Fetch and publish Loz branches
        run: tools/mirror-loz.sh
